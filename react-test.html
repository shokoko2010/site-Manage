<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Test</title>
</head>
<body>
    <div id="root"></div>
    <script type="module">
        console.log('Starting React test...');
        
        try {
            // Test basic React functionality
            const TestComponent = () => {
                const [count, setCount] = React.useState(0);
                
                return React.createElement('div', { style: { padding: '20px', fontFamily: 'Arial' } }, [
                    React.createElement('h1', { key: 'title' }, 'React Test Component'),
                    React.createElement('p', { key: 'count' }, `Count: ${count}`),
                    React.createElement('button', { 
                        key: 'button', 
                        onClick: () => setCount(count + 1),
                        style: { padding: '10px', fontSize: '16px' }
                    }, 'Increment')
                ]);
            };
            
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(React.createElement(TestComponent));
            
            console.log('React test component rendered successfully');
        } catch (error) {
            console.error('Error in React test:', error);
            document.getElementById('root').innerHTML = `
                <div style="color: red; padding: 20px;">
                    <h1>React Error</h1>
                    <p>Error: ${error.message}</p>
                    <pre>${error.stack}</pre>
                </div>
            `;
        }
    </script>
</body>
</html>
