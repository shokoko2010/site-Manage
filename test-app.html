<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test App</title>
</head>
<body>
    <div id="root"></div>
    <script type="module">
        import React from 'react';
        import ReactDOM from 'react-dom/client';
        
        function TestApp() {
            return React.createElement('div', { style: { padding: '20px', fontFamily: 'Arial, sans-serif' } }, [
                React.createElement('h1', { key: 'title' }, 'Test App Working!'),
                React.createElement('p', { key: 'text' }, 'If you see this, React is working correctly.'),
                React.createElement('p', { key: 'time' }, `Time: ${new Date().toLocaleString()}`),
                React.createElement('button', { 
                    key: 'button', 
                    onClick: () => alert('Button clicked!'),
                    style: { padding: '10px 20px', fontSize: '16px', backgroundColor: '#007bff', color: 'white', border: 'none', borderRadius: '4px' }
                }, 'Click Me')
            ]);
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(TestApp));
    </script>
</body>
</html>
