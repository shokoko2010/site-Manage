<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Direct Test</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
</head>
<body>
    <div id="root"></div>
    <script>
        console.log('Direct React test starting...');
        
        try {
            console.log('React available:', !!React);
            console.log('ReactDOM available:', !!ReactDOM);
            
            const root = ReactDOM.createRoot(document.getElementById('root'));
            console.log('Root created:', !!root);
            
            const TestComponent = () => {
                return React.createElement('div', { 
                    style: { 
                        padding: '20px', 
                        backgroundColor: '#e0e7ff', 
                        border: '2px solid #6366f1', 
                        borderRadius: '8px' 
                    } 
                }, 
                    React.createElement('h1', { style: { color: '#312e81', marginBottom: '10px' } }, 'Direct React Test'),
                    React.createElement('p', { style: { color: '#4338ca' } }, 'If you can see this, Direct React is working!'),
                    React.createElement('button', { 
                        onClick: () => alert('Direct React button clicked!'),
                        style: { 
                            backgroundColor: '#6366f1', 
                            color: 'white', 
                            padding: '8px 16px', 
                            border: 'none', 
                            borderRadius: '4px', 
                            cursor: 'pointer', 
                            marginTop: '10px' 
                        }
                    }, 'Click Me')
                );
            };
            
            root.render(React.createElement(TestComponent));
            console.log('Direct React test completed successfully');
            
        } catch (error) {
            console.error('Direct React test failed:', error);
            
            const rootElement = document.getElementById('root');
            if (rootElement) {
                rootElement.innerHTML = `
                    <div style="padding: 20px; background-color: #fef2f2; border: 2px solid #dc2626; border-radius: 8px;">
                        <h1 style="color: #7f1d1d;">Direct React Error</h1>
                        <p style="color: #991b1b;">There was an error loading Direct React:</p>
                        <pre style="background: white; padding: 10px; margin: 10px 0; color: #7f1d1d;">${error.message}</pre>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
